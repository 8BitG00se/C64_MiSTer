# LEVEL 2 REMASTER (Build 14): rtl/remaster.sv + rtl/rgb256.sv in Verilator against the model, every pixel
# (sim/remaster/run.sh), and the Level 1 unit's own test (sim/rgb256 is run by the core build).
name: Remaster simulation

on:
  push:
    branches: [ 'build14*' ]
    paths: [ 'rtl/remaster.sv', 'rtl/rgb256.sv', 'sim/remaster/**', '.github/workflows/remaster-sim.yml' ]
  workflow_dispatch:

jobs:
  sim:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Tools
        run: |
          sudo apt-get update -qq >/dev/null
          sudo apt-get install -y -qq verilator >/dev/null
          verilator --version
          python3 -c "import numpy, PIL" 2>/dev/null || pip install -q numpy pillow
      - name: The remaster unit against the model
        run: sim/remaster/run.sh
