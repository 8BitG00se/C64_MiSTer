# OCTOPHONIC: builds the core on GitHub - every push to master, or by hand from the
# Actions tab (Run workflow). The core comes out as the artifact "C64_Octophonic":
# open the run, download it, unzip, and copy the .rbf to the MiSTer's _Computer folder.
name: Build core

on:
  push:
    branches: [ master, octovic, octovic2, octophonic-v1.1, octovic-mem, octophonic-core3 ]
  workflow_dispatch:

permissions:
  contents: write          # to keep the fit and timing reports on the build-reports branch

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Make room for Quartus
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: OctoVIC register map test (every register, the version, the core's name, the meters)
        run: |
          for i in 1 2 3 4 5; do sudo apt-get update -qq >/dev/null 2>&1; sudo apt-get install -y -qq verilator >/dev/null && break; echo "apt: try $i failed"; sleep 30; done; command -v verilator >/dev/null
          sim/regmap/run.sh

      - name: OctoVIC sprite table, frame by frame against the emulator's model (DDR3 idle, busy, held; no VDATA byte lost)
        run: |
          python3 -c "import numpy" 2>/dev/null || pip install -q numpy
          sim/sprtable/run.sh

      - name: The eight-SID mix in GHDL against the emulator's integer model (Fix 28)
        run: |
          for i in 1 2 3 4 5; do sudo apt-get update -qq >/dev/null 2>&1; sudo apt-get install -y -qq ghdl >/dev/null && break; echo "apt: try $i failed"; sleep 30; done; command -v ghdl >/dev/null
          sim/level/mixtest.sh

      - name: Stamp the core's build date (OctoVIC $D6B4-$D6B6)
        run: |
          sed -i "s/localparam \[23:0\] CORE_DATE = 24'h[0-9]*;/localparam [23:0] CORE_DATE = 24'h$(date -u +%y%m%d);/" rtl/octovic/octovic.sv
          grep -n "CORE_TAG\|CORE_DATE" rtl/octovic/octovic.sv | head -2

      - name: Compile with Quartus 17.0 Lite
        continue-on-error: true
        id: compile
        run: |
          docker run --rm -v "$PWD":/build -w /build raetro/quartus:17.0 \
            quartus_sh --flow compile C64.qpf

      - name: The worst hold paths (start and end points, every corner)
        continue-on-error: true
        run: |
          docker run --rm -v "$PWD":/build -w /build raetro/quartus:17.0 quartus_sta -t sim/timing/worst_hold.tcl || true

      - name: Name the core
        run: |
          mkdir -p out
          TAG=$(sed -n 's/^localparam \[63:0\] CORE_TAG *= *"\([^"]*\)".*/\1/p' rtl/octovic/octovic.sv | tr -d ' ' | tr 'A-Z' 'a-z')
          cp output_files/C64.rbf "out/C64_Octophonic_$(date -u +%Y%m%d)_${TAG}.rbf"
          grep -h -A3 "Fitter Resource Usage Summary" output_files/*.fit.summary output_files/*.fit.rpt 2>/dev/null | head -20 || true
          cat output_files/C64.fit.summary || true

      - uses: actions/upload-artifact@v4
        with:
          name: C64_Octophonic
          path: |
            out/*.rbf
            output_files/*.summary

      # the reports where they can be read without downloading anything: the fit (how full the
      # FPGA is) and the timing (whether it runs fast enough), kept even when the build fails
      - name: Keep the reports
        if: always()
        run: |
          # Quartus ran as root in its container: its files are root's
          sudo chown -R "$(id -u):$(id -g)" output_files 2>/dev/null || true
          mkdir -p /tmp/reports
          cp output_files/*.summary /tmp/reports/ 2>/dev/null || true
          cp output_files/worst_hold_*.txt /tmp/reports/ 2>/dev/null || true
          cp out/*.rbf /tmp/reports/ 2>/dev/null || true          # the core itself, so it can be fetched with git
          grep -h -iE "^error|critical warning" output_files/*.rpt 2>/dev/null | head -200 > /tmp/reports/errors.txt || true
          # where the memories went (block RAM or logic), and what each part of the design costs
          grep -h -E "uninferred|Inferred .*RAM|ram_block|altsyncram" output_files/C64.map.rpt 2>/dev/null | head -100 > /tmp/reports/rams.txt || true
          awk '/Analysis & Synthesis Resource Utilization by Entity/{f=1} f{print; n++} n>400{exit}' output_files/C64.map.rpt 2>/dev/null \
            | grep -E "Compilation Hierarchy Node|octovic|ddram_arb|fpga64_sid_iec:fpga64\||sid_top|emu\|" | head -60 > /tmp/reports/entities.txt || true
          # every RAM the fitter placed (its size, M10Ks or MLABs) and each part of the design's ALMs and M10Ks -
          # where block RAM can be found for a new feature (OCTOSCOPE, Fix 55)
          awk '/; Fitter RAM Summary/{f=1} f{print} f&&/^$/{n++} n>=2{exit}' output_files/C64.fit.rpt 2>/dev/null | cut -c1-700 > /tmp/reports/fit_rams.txt || true
          awk '/; Fitter Resource Utilization by Entity/{f=1} f{print} f&&/^$/{n++} n>=2{exit}' output_files/C64.fit.rpt 2>/dev/null | cut -c1-400 > /tmp/reports/fit_entities.txt || true
          echo "${{ steps.compile.outcome }} $(git rev-parse --short HEAD) $(date -u +%Y-%m-%dT%H:%MZ)" > /tmp/reports/result.txt
          cd /tmp/reports
          git init -q
          git checkout -q -b build-reports
          git add -A
          git -c user.name="Octophonic build" -c user.email="noreply@github.com" commit -qm "Reports: $(cat result.txt)"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" HEAD:build-reports-core10-s21

      - name: Fail if Quartus failed
        if: steps.compile.outcome != 'success'
        run: exit 1
