# OCTOPHONIC: builds the core on GitHub - every push to master, or by hand from the
# Actions tab (Run workflow). The core comes out as the artifact "C64_Octophonic":
# open the run, download it, unzip, and copy the .rbf to the MiSTer's _Computer folder.
name: Build core

on:
  push:
    branches: [ master, octovic, octovic2 ]
  workflow_dispatch:

permissions:
  contents: write          # to keep the fit and timing reports on the build-reports branch

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Make room for Quartus
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Compile with Quartus 17.0 Lite
        continue-on-error: true
        id: compile
        run: |
          docker run --rm -v "$PWD":/build -w /build raetro/quartus:17.0 \
            quartus_sh --flow compile C64.qpf

      - name: Name the core
        run: |
          mkdir -p out
          cp output_files/C64.rbf "out/C64_Octophonic_$(date +%Y%m%d).rbf"
          grep -h -A3 "Fitter Resource Usage Summary" output_files/*.fit.summary output_files/*.fit.rpt 2>/dev/null | head -20 || true
          cat output_files/C64.fit.summary || true

      - uses: actions/upload-artifact@v4
        with:
          name: C64_Octophonic
          path: |
            out/*.rbf
            output_files/*.summary

      # the reports where they can be read without downloading anything: the fit (how full the
      # FPGA is) and the timing (whether it runs fast enough), kept even when the build fails
      - name: Keep the reports
        if: always()
        run: |
          # Quartus ran as root in its container: its files are root's
          sudo chown -R "$(id -u):$(id -g)" output_files 2>/dev/null || true
          mkdir -p /tmp/reports
          cp output_files/*.summary /tmp/reports/ 2>/dev/null || true
          cp out/*.rbf /tmp/reports/ 2>/dev/null || true          # the core itself, so it can be fetched with git
          grep -h -iE "^error|critical warning" output_files/*.rpt 2>/dev/null | head -200 > /tmp/reports/errors.txt || true
          # where the memories went (block RAM or logic), and what each part of the design costs
          grep -h -E "uninferred|Inferred .*RAM|ram_block|altsyncram" output_files/C64.map.rpt 2>/dev/null | head -100 > /tmp/reports/rams.txt || true
          awk '/Analysis & Synthesis Resource Utilization by Entity/{f=1} f{print; n++} n>400{exit}' output_files/C64.map.rpt 2>/dev/null \
            | grep -E "Compilation Hierarchy Node|octovic|ddram_arb|fpga64_sid_iec:fpga64\||sid_top|emu\|" | head -60 > /tmp/reports/entities.txt || true
          echo "${{ steps.compile.outcome }} $(git rev-parse --short HEAD) $(date -u +%Y-%m-%dT%H:%MZ)" > /tmp/reports/result.txt
          cd /tmp/reports
          git init -q
          git checkout -q -b build-reports
          git add -A
          git -c user.name="Octophonic build" -c user.email="noreply@github.com" commit -qm "Reports: $(cat result.txt)"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" build-reports

      - name: Fail if Quartus failed
        if: steps.compile.outcome != 'success'
        run: exit 1
