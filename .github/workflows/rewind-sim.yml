# REWIND (Fix 61): the whole C64 in Verilator with the rewind unit - a save and restore round trip and a
# game-like program run backwards. The results (and the C64 as Verilog) are kept on the branch sim-<branch>.
name: Rewind simulation

on:
  push:
    branches: [ 'build13*' ]
    paths: [ 'rtl/**', 'c64.sv', 'sim/rewind/**', '.github/workflows/rewind-sim.yml' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sim:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Tools
        run: |
          sudo apt-get update -qq >/dev/null
          sudo apt-get install -y -qq ghdl verilator ffmpeg >/dev/null
          ghdl --version | head -1; verilator --version
          python3 -c "import numpy, PIL" 2>/dev/null || pip install -q numpy pillow
      - name: The C64 as Verilog (GHDL)
        continue-on-error: true
        run: |
          mkdir -p /tmp/rewind
          sim/rewind/vhdl2v.sh /tmp/rewind 2>&1 | tee /tmp/rewind/vhdl2v.txt
      - name: The rewind tests
        continue-on-error: true
        run: |
          if [ -x sim/rewind/run.sh ]; then sim/rewind/run.sh /tmp/rewind 2>&1 | tee /tmp/rewind/run.txt; fi
      - name: Keep the results
        if: always()
        run: |
          mkdir -p /tmp/keep && cd /tmp/rewind
          cp -f *.txt *.log *.png *.mp4 *.csv /tmp/keep/ 2>/dev/null || true
          gzip -9 -c fpga64_synth.v > /tmp/keep/fpga64_synth.v.gz 2>/dev/null || true
          cd /tmp/keep
          echo "$(git -C $GITHUB_WORKSPACE rev-parse --short HEAD) $(date -u +%Y-%m-%dT%H:%MZ)" > result.txt
          git init -q
          git checkout -q -b "sim-${GITHUB_REF_NAME}"
          git add -A
          git -c user.name="Octophonic build" -c user.email="noreply@github.com" commit -qm "Rewind sim: $(cat result.txt)"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" "sim-${GITHUB_REF_NAME}"
